# model params
diffusion:
 sigma_data: 0.5
 P_mean: -1.0
 P_std: 1.4
 sigma_max: 80
  
# network params
network:
 in_channels: 3 
 out_channels: 3 
 num_blocks: 2 
 attn_resolutions: [16] 
 model_channels: 96 
 channel_mult: [1,2,2] 
 dropout: 0.2
 img_resolution: 32 
 label_dim: 0
 embedding_type: 'positional' 
 encoder_type: 'standard' 
 decoder_type: 'standard' 
 augment_dim: 9 
 channel_mult_noise: 1 
 resample_filter: [1, 1]

# training params
n_epoch: 4000
# global_batch_size: 128
global_batch_size: 512
global_seed: 1334
learning_rate: 1.0e-4
warm_epoch: 200
load_epoch: -1
flip: True
ema: 0.9993
num_workers: 8
log_every: 100

# testing params
n_sample: 30
save_dir: './results/2000_unconditional_CM'
save_model: True

# Sampling
sampling_batch_size: 125
epoch_checkpoint: -1