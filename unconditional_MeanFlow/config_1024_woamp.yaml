# config.yaml
# model params
diffusion:
 norm_eps: 1e-3
 norm_p: 0.75
 ratio: 0.75
 P_mean_t: -0.6
 P_std_t: 1.6
 P_mean_r: -4.0
 P_std_r: 1.6 
  
# network params
network:
 in_channels: 3 
 out_channels: 3 
 num_blocks: 2 
 attn_resolutions: [16] 
 model_channels: 96 
 channel_mult: [1,2,2] 
 dropout: 0.2
 img_resolution: 32 
 label_dim: 0
 embedding_type: 'positional' 
 encoder_type: 'standard' 
 decoder_type: 'standard' 
 augment_dim: 9 
 channel_mult_noise: 1 
 resample_filter: [1, 1]

# training params
n_epoch: 2000
global_batch_size: 1024
global_seed: 1334
learning_rate: 1.0e-4
warm_epoch: 200
load_epoch: -1
flip: True
ema: 0.9993
num_workers: 8
log_every: 100
use_amp: False


# testing params
n_sample: 30
save_dir: './results/2000_unconditional_MeanFlow_b1024_woamp'
save_model: True

# Sampling
sampling_batch_size: 125
epoch_checkpoint: -1